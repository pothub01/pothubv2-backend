<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — PotHub</title>
<meta name="description" content="Manage your PotHub account, orders, and profile.">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
<style>
/* ── ACCOUNT PAGE ── */
.account-layout { display:grid; grid-template-columns:260px 1fr; gap:32px; padding:40px 0; }
.account-sidebar { background:var(--card); border-radius:16px; padding:24px; height:fit-content; position:sticky; top:100px; }
.account-avatar { width:80px; height:80px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto 16px; }
.account-name { text-align:center; font-weight:700; font-size:18px; margin-bottom:4px; }
.account-email { text-align:center; font-size:13px; color:var(--mid); margin-bottom:20px; }
.account-nav { display:flex; flex-direction:column; gap:4px; }
.account-nav-item { padding:12px 16px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:500; display:flex; align-items:center; gap:10px; transition:all .2s; border:none; background:none; width:100%; color:var(--dark); }
.account-nav-item:hover, .account-nav-item.active { background:var(--green-light); color:var(--green); }
.account-nav-item .icon { font-size:18px; }
.account-main { background:var(--card); border-radius:16px; padding:32px; }
.account-section { display:none; }
.account-section.active { display:block; }
.account-section-title { font-size:24px; font-weight:800; margin-bottom:24px; }

/* Orders */
.order-card { border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
.order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.order-number { font-weight:700; font-size:16px; }
.order-status { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; }
.order-status.confirmed { background:#d4edda; color:#155724; }
.order-status.pending { background:#fff3cd; color:#856404; }
.order-status.shipped { background:#cce5ff; color:#004085; }
.order-status.delivered { background:#d1ecf1; color:#0c5460; }
.order-date { font-size:13px; color:var(--mid); }
.order-total { font-size:18px; font-weight:800; }
.order-items { font-size:13px; color:var(--mid); margin-top:8px; }
.no-orders { text-align:center; padding:40px; color:var(--mid); }
.no-orders .icon { font-size:48px; margin-bottom:16px; }

/* Profile Form */
.profile-form { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.profile-form .form-group.full { grid-column:1 / -1; }
.profile-form label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
.profile-form input, .profile-form textarea { width:100%; padding:12px 16px; border:1px solid var(--border); border-radius:10px; font-size:14px; background:var(--bg); }
.profile-form input:focus, .profile-form textarea:focus { outline:none; border-color:var(--green); }
.save-btn { margin-top:20px; padding:14px 32px; background:var(--green); color:#fff; border:none; border-radius:10px; font-weight:700; cursor:pointer; }
.save-btn:hover { background:var(--green-dark); }

/* Address Cards */
.address-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.address-card { border:1px solid var(--border); border-radius:12px; padding:20px; position:relative; }
.address-card.default { border-color:var(--green); }
.address-badge { position:absolute; top:12px; right:12px; padding:2px 8px; background:var(--green-light); color:var(--green); font-size:11px; font-weight:600; border-radius:4px; }
.address-name { font-weight:700; margin-bottom:4px; }
.address-text { font-size:13px; color:var(--mid); line-height:1.6; }
.address-actions { margin-top:12px; display:flex; gap:8px; }
.address-actions button { padding:6px 12px; font-size:12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); cursor:pointer; }

/* Wishlist */
.wishlist-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:20px; }
.wishlist-item { border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.wishlist-item img { width:100%; height:160px; object-fit:cover; background:var(--bg); }
.wishlist-info { padding:16px; }
.wishlist-name { font-weight:700; font-size:14px; margin-bottom:4px; }
.wishlist-price { color:var(--green); font-weight:800; }
.wishlist-remove { width:100%; padding:10px; background:none; border:none; border-top:1px solid var(--border); color:var(--danger); cursor:pointer; font-size:13px; }

@media (max-width:768px) {
  .account-layout { grid-template-columns:1fr; }
  .account-sidebar { position:static; }
  .profile-form, .address-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div id="nav-root"></div>

<section class="section">
  <div class="container">
    <div class="account-layout">

      <!-- Sidebar -->
      <aside class="account-sidebar">
        <div class="account-avatar" id="user-avatar">🌿</div>
        <div class="account-name" id="user-display-name">Loading...</div>
        <div class="account-email" id="user-display-email">...</div>

        <nav class="account-nav">
          <button class="account-nav-item active" onclick="showSection('orders')">
            <span class="icon">📦</span> My Orders
          </button>
          <button class="account-nav-item" onclick="showSection('profile')">
            <span class="icon">👤</span> Profile
          </button>
          <button class="account-nav-item" onclick="showSection('addresses')">
            <span class="icon">📍</span> Addresses
          </button>
          <button class="account-nav-item" onclick="showSection('wishlist')">
            <span class="icon">❤️</span> Wishlist
          </button>
          <button class="account-nav-item" onclick="logout()">
            <span class="icon">🚪</span> Logout
          </button>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="account-main">

        <!-- Orders Section -->
        <div class="account-section active" id="section-orders">
          <h2 class="account-section-title">My Orders</h2>
          <div id="orders-list">
            <div class="no-orders">
              <div class="icon">📦</div>
              <p>Loading your orders...</p>
            </div>
          </div>
        </div>

        <!-- Profile Section -->
        <div class="account-section" id="section-profile">
          <h2 class="account-section-title">Profile Settings</h2>
          <form class="profile-form" id="profile-form" onsubmit="saveProfile(event)">
            <div class="form-group">
              <label>First Name</label>
              <input type="text" id="profile-first" placeholder="First name">
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" id="profile-last" placeholder="Last name">
            </div>
            <div class="form-group full">
              <label>Email Address</label>
              <input type="email" id="profile-email" placeholder="your@email.com" readonly style="opacity:.6">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="profile-phone" placeholder="+63 912 345 6789">
            </div>
            <div class="form-group full">
              <button type="submit" class="save-btn">Save Changes</button>
            </div>
          </form>
        </div>

        <!-- Addresses Section -->
        <div class="account-section" id="section-addresses">
          <h2 class="account-section-title">Saved Addresses</h2>
          <div class="address-grid" id="address-list">
            <div class="address-card default">
              <span class="address-badge">Default</span>
              <div class="address-name" id="addr-name">Loading...</div>
              <div class="address-text" id="addr-text">...</div>
              <div class="address-actions">
                <button onclick="editAddress()">Edit</button>
                <button onclick="deleteAddress()">Delete</button>
              </div>
            </div>
            <div class="address-card" style="display:flex;align-items:center;justify-content:center;cursor:pointer;border-style:dashed" onclick="addAddress()">
              <div style="text-align:center;color:var(--mid)">
                <div style="font-size:24px;margin-bottom:8px">+</div>
                <div style="font-size:13px">Add New Address</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Wishlist Section -->
        <div class="account-section" id="section-wishlist">
          <h2 class="account-section-title">My Wishlist</h2>
          <div class="wishlist-grid" id="wishlist-grid">
            <div class="no-orders">
              <div class="icon">💚</div>
              <p>Your wishlist is empty</p>
              <a href="/shop" class="btn btn-green" style="margin-top:16px;display:inline-block">Browse Products</a>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>
</section>

<div id="footer-root"></div>

<script src="{{ url_for('static', filename='js/components.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
// ── Check Auth ──
const user = JSON.parse(localStorage.getItem('pothub_user') || 'null');
if (!user || !user.email) {
  window.location.href = '/login';
}

// ── Load Profile ──
async function loadProfile() {
  if (!user) return;

  document.getElementById('user-display-name').textContent = user.name || 'Plant Parent';
  document.getElementById('user-display-email').textContent = user.email;
  document.getElementById('user-avatar').textContent = (user.name || 'P').charAt(0).toUpperCase();

  document.getElementById('profile-first').value = user.first_name || '';
  document.getElementById('profile-last').value = user.last_name || '';
  document.getElementById('profile-email').value = user.email;
  document.getElementById('profile-phone').value = user.phone || '';

  // Update address card
  document.getElementById('addr-name').textContent = user.name || 'Default Address';
  document.getElementById('addr-text').innerHTML = 
    (user.address || 'No address saved yet') + '<br>' +
    (user.city ? user.city + ', ' : '') + 
    (user.province || '') + '<br>' +
    (user.phone || '');
}

// ── Load Orders ──
async function loadOrders() {
  if (!user || !user.email) return;

  try {
    const r = await fetch(`/api/orders/user/${encodeURIComponent(user.email)}`);
    const data = await r.json();

    const container = document.getElementById('orders-list');

    if (!data.orders || data.orders.length === 0) {
      container.innerHTML = `
        <div class="no-orders">
          <div class="icon">📦</div>
          <p>No orders yet</p>
          <a href="/shop" class="btn btn-green" style="margin-top:16px;display:inline-block">Start Shopping</a>
        </div>`;
      return;
    }

    container.innerHTML = data.orders.map(order => `
      <div class="order-card">
        <div class="order-header">
          <div>
            <div class="order-number">${order.order_number}</div>
            <div class="order-date">${new Date(order.created_at).toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'})}</div>
          </div>
          <div style="text-align:right">
            <span class="order-status ${order.status}">${order.status}</span>
            <div class="order-total">₱${order.total.toLocaleString()}</div>
          </div>
        </div>
        <div class="order-items">${order.item_count} item${order.item_count !== 1 ? 's' : ''}</div>
      </div>
    `).join('');

  } catch (e) {
    console.error('Failed to load orders:', e);
    document.getElementById('orders-list').innerHTML = `
      <div class="no-orders">
        <div class="icon">⚠️</div>
        <p>Could not load orders. Try again later.</p>
      </div>`;
  }
}

// ── Save Profile ──
async function saveProfile(e) {
  e.preventDefault();

  const updates = {
    email: user.email,
    first_name: document.getElementById('profile-first').value,
    last_name: document.getElementById('profile-last').value,
    phone: document.getElementById('profile-phone').value
  };

  try {
    const r = await fetch('/api/auth/profile', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates)
    });

    if (r.ok) {
      // Update local user
      user.name = updates.first_name + ' ' + updates.last_name;
      user.first_name = updates.first_name;
      user.last_name = updates.last_name;
      user.phone = updates.phone;
      localStorage.setItem('pothub_user', JSON.stringify(user));

      showToast('✅ Profile updated successfully!', 'success');
      loadProfile(); // Refresh display
    } else {
      showToast('❌ Failed to update profile', 'error');
    }
  } catch (e) {
    showToast('❌ Network error', 'error');
  }
}

// ── Section Navigation ──
function showSection(section) {
  document.querySelectorAll('.account-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.account-nav-item').forEach(b => b.classList.remove('active'));

  document.getElementById('section-' + section).classList.add('active');
  event.target.closest('.account-nav-item').classList.add('active');

  if (section === 'orders') loadOrders();
  if (section === 'wishlist') loadWishlist();
}

// ── Wishlist ──
function loadWishlist() {
  const wishlist = JSON.parse(localStorage.getItem('pothub_wishlist') || '[]');
  const grid = document.getElementById('wishlist-grid');

  if (wishlist.length === 0) {
    grid.innerHTML = `
      <div class="no-orders" style="grid-column:1/-1">
        <div class="icon">💚</div>
        <p>Your wishlist is empty</p>
        <a href="/shop" class="btn btn-green" style="margin-top:16px;display:inline-block">Browse Products</a>
      </div>`;
    return;
  }

  // Would need to fetch product details - simplified for now
  grid.innerHTML = wishlist.map(id => `
    <div class="wishlist-item">
      <div style="height:160px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:48px">🪴</div>
      <div class="wishlist-info">
        <div class="wishlist-name">Product #${id}</div>
        <div class="wishlist-price">View in shop</div>
      </div>
      <button class="wishlist-remove" onclick="removeFromWishlist(${id})">Remove</button>
    </div>
  `).join('');
}

function removeFromWishlist(id) {
  let wishlist = JSON.parse(localStorage.getItem('pothub_wishlist') || '[]');
  wishlist = wishlist.filter(w => w !== id);
  localStorage.setItem('pothub_wishlist', JSON.stringify(wishlist));
  loadWishlist();
  showToast('Removed from wishlist', 'success');
}

function addAddress() {
  showToast('Address editing coming soon', 'info');
}
function editAddress() {
  showToast('Address editing coming soon', 'info');
}
function deleteAddress() {
  showToast('Address deletion coming soon', 'info');
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  loadProfile();
  loadOrders();
});
</script>

</body>
</html>
